name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  locales:
    name: Audit locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Every locale complete (205 files), README.md symlinks, translated slugs,
      # links and anchors resolving. Exits 1 on any problem.
      - run: python3 scripts/audit-locales.py

  site:
    name: Build and verify the website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: architecture-decision-record.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: architecture-decision-record.github.io/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Committed generated files (src/content/locales, locale-pages.json,
      # search indexes, llms files, sitemap) must match `locales/`.
      - name: Generated files are up to date
        run: |
          pnpm run content
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)" || { git status --short -- .; exit 1; }

      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run build
      # No broken internal links or anchors in the prerendered pages.
      - run: pnpm run verify
      # axe-core (WCAG 2.2 AA) on key pages at desktop and phone width, plus colour
      # contrast on all 45 themes, in a real browser. The runner's preinstalled
      # Google Chrome is used, so no browser download is needed.
      - run: pnpm run a11y
        env:
          PW_CHANNEL: chrome
